[project]
name = "kw-notice-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "apscheduler>=3.11",
    "anthropic>=0.40",
    "nh3>=0.2.18",
]

[tool.setuptools.packages.find]
include = ["app*"]
